<!DOCTYPE html>
<html>
<head>
  <title>FTC Sim</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .tabs {
      display: flex;
      background: #222;
    }

    button {
      padding: 10px 14px;
      border: none;
      cursor: pointer;
      background: #333;
      color: white;
      margin-right: 6px;
    }

    button:hover {
      background: #444;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    #driverStation,
    #hardwareTab {
      padding: 20px;
    }

    canvas {
      display: block;
      background: #2f6f3e;
    }

    #info {
      position: fixed;
      top: 60px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      padding: 10px;
      border-radius: 8px;
    }

    select,
    input {
      padding: 8px;
      min-width: 220px;
      margin-right: 8px;
    }

    .hardware-row {
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button onclick="showTab('driverStation')">Driver Station</button>
    <button onclick="showTab('hardwareTab')">Hardware Map</button>
    <button onclick="showTab('fieldTab')">Field</button>
  </div>

  <div id="driverStation" class="tab active">
    <h1>Driver Station</h1>

    <button onclick="requestOpModes()">Scan OpModes</button>

    <p>Select program:</p>
    <select id="opModeSelect"></select>

    <br><br>

    <button id="mainActionButton" onclick="mainAction()">INIT</button>

    <p id="status">Disconnected</p>
  </div>

  <div id="hardwareTab" class="tab">
    <h1>Hardware Map</h1>

    <p>Add hardware names so code like <code>hardwareMap.get(DcMotor.class, "leftFront")</code> works.</p>

    <button onclick="addHardwareRow()">+ Add Component</button>
    <button onclick="saveHardwareMap()">Save Hardware Map</button>

    <div id="hardwareRows"></div>
  </div>

  <div id="fieldTab" class="tab">
    <div id="info">Connecting...</div>
    <canvas id="field"></canvas>
  </div>

  <script src="./src/main.js"></script>
</body>
</html>
