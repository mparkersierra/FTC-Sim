<!DOCTYPE html>
<html>
<head>
  <title>FTC Sim</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .tabs {
      display: flex;
      background: #222;
    }

    button {
      padding: 10px 14px;
      border: none;
      cursor: pointer;
      background: #333;
      color: white;
      margin-right: 6px;
    }

    button:hover {
      background: #444;
    }

    button.active {
      background: #555;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    #driverStation,
    #configurationTab {
      padding: 20px;
    }

    canvas {
      display: block;
      background: #2f6f3e;
    }

    #info {
      position: fixed;
      top: 60px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      padding: 10px;
      border-radius: 8px;
    }

    select,
    input {
      padding: 8px;
      min-width: 220px;
      margin-right: 8px;
    }

    h2 {
      margin-top: 28px;
    }

    .hardware-row {
      margin: 12px 0;
    }

    .config-actions {
      display: flex;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .gamepad-configs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .gamepad-config {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      background: #181818;
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .mapping-slot {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 66px;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #242424;
    }

    .mapping-slot.active {
      border-color: #f7d84a;
      background: #343018;
    }

    .mapping-label {
      color: #bbb;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .mapping-value {
      font-weight: bold;
    }

    .input-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 24px;
    }

    .input-palette button {
      margin-right: 0;
      min-width: 52px;
    }

    #bindingHint {
      min-height: 20px;
      color: #f7d84a;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button data-tab-button="driverStation" onclick="showTab('driverStation')">Driver Station</button>
    <button data-tab-button="configurationTab" onclick="showTab('configurationTab')">Configuration</button>
    <button data-tab-button="fieldTab" onclick="showTab('fieldTab')">Field</button>
  </div>

  <div id="driverStation" class="tab active">
    <h1>Driver Station</h1>

    <button onclick="requestOpModes()">Scan OpModes</button>

    <p>Select program:</p>
    <select id="opModeSelect"></select>

    <br><br>

    <button id="mainActionButton" onclick="mainAction()">INIT</button>

    <p id="status">Disconnected</p>
  </div>

  <div id="configurationTab" class="tab">
    <h1>Configuration</h1>

    <h2>Hardware Map</h2>

    <p>Add hardware names so code like <code>hardwareMap.get(DcMotor.class, "leftFront")</code> works.</p>

    <div class="config-actions">
      <button onclick="addHardwareRow()">+ Add Component</button>
      <button onclick="saveHardwareMap()">Save Hardware Map</button>
    </div>

    <div id="hardwareRows"></div>

    <h2>Gamepad Mapping</h2>
    <p>Click a mapping space, then click a control button below or press a key.</p>
    <p id="bindingHint"></p>
    <div id="inputPalette" class="input-palette"></div>
    <div id="gamepadMappings" class="gamepad-configs"></div>
  </div>

  <div id="fieldTab" class="tab">
    <div id="info">Connecting...</div>
    <canvas id="field"></canvas>
  </div>

  <script src="./src/main.js"></script>
</body>
</html>
