plugins {
    id "application"
}

dependencies {
    implementation project(":packages:ftc-sdk-shim")
    implementation project(":vendor:TeamCode")
    implementation "org.java-websocket:Java-WebSocket:1.5.6"
}

application {
    mainClass = "com.mparkersierra.ftcsim.runner.Main"
}

run {
    standardInput = System.in
}